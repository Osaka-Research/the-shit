services:
  - type: web
    name: voice-relay
    runtime: docker
    # Standard: 2GB RAM, 1 real dedicated vCPU (vs. Starter's 0.5 vCPU
    # slice, which is what caused the original transcription timeouts).
    # No disk needed — LLM replies go through Groq (hosted), not a
    # self-hosted model, so there's nothing left that needs persistent
    # storage.
    plan: standard
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
